# Every push to main: run the tests, then publish the app to GitHub Pages.
# Only the files the site needs are published: index.html, converter.html, src/, vendor/,
# plus what tools/build-share.js generates: src/share-template.js ("Share as file"),
# swimtimescoach.html (downloadable app) and demo.html (live demo).
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect site files
        run: |
          node tools/build-share.js
          mkdir _site
          cp -r index.html converter.html swimtimescoach.html demo.html src vendor _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
