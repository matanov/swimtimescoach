<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Times — CL2 Viewer</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header>
  <h1>Best Times<small>Load Hy-Tek .cl2 / .sd3 results or the results .zip. Nothing leaves your browser.</small></h1>
  <div class="actions">
    <button class="btn primary" id="addBtn">Add files</button>
    <button class="btn" id="openBtn" title="Reopen a session saved with Save session">Open session</button>
    <button class="btn" id="pickBtn" disabled>Choose swimmers</button>
    <label class="btn noprint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="appendixChk"> Include all swims in print</label>
    <button class="btn" id="printBtn" disabled>Print / Save PDF</button>
    <button class="btn" id="csvBtn" disabled>Download CSV</button>
    <button class="btn" id="saveBtn" disabled title="Download one file with all loaded meets and your selection, to reopen later">Save session</button>
    <button class="btn" id="clearBtn" disabled>Clear</button>
  </div>
  <input type="file" id="fileInput" multiple accept=".cl2,.sd3,.zip,.CL2,.SD3,.ZIP" hidden>
</header>

<div id="drop"><strong>Drop .cl2 files or a saved session here</strong> or use Add files. You can add more meets at any time.</div>
<div id="files"></div>
<div id="msg" role="status"></div>

<div id="printhead">
  <h1 id="phTitle">Best Times</h1>
  <p id="phMeets"></p>
  <p id="phDate"></p>
</div>

<div class="wrap" id="wrap"><div class="empty">No results loaded yet.</div></div>
<div id="appendix"></div>

<dialog id="detail">
  <div class="dhead">
    <div><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <button class="btn" data-close>Close</button>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

<dialog id="picker">
  <div class="dhead">
    <div><h2>Choose swimmers</h2><p id="pkCount"></p></div>
    <button class="btn" data-close>Done</button>
  </div>
  <div class="pk-tools">
    <input type="search" id="pkSearch" placeholder="Search by name">
    <select id="pkTeam"><option value="">All teams</option></select>
  </div>
  <div class="pk-list" id="pkList"></div>
  <div class="pk-foot">
    <div style="display:flex;gap:8px">
      <button class="btn" id="pkAll">Select shown</button>
      <button class="btn" id="pkNone">Clear shown</button>
    </div>
    <button class="btn primary" data-close>Show table</button>
  </div>
</dialog>

<script src="vendor/jszip.min.js"></script>
<script src="src/cl2.js"></script>
<script src="src/session.js"></script>
<script src="src/app.js"></script>
</body>
</html>
